name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: python -m json.tool contracts/openapi.json >/dev/null
      - run: python -m json.tool contracts/realtime.json >/dev/null
      - run: python scripts/validate_contracts.py
      - run: python -m unittest contracts/test_contract.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.11", "3.12", "3.13", "3.14"]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: python -m pip install -e 'packages/python[dev]' twine
      - run: cd packages/python && ruff check . && mypy src && pytest
      - run: python -m build --outdir release/distributions packages/python
      - run: python -m twine check release/distributions/*
      - run: for artifact in release/distributions/*; do python scripts/validate_artifact.py python "$artifact"; done
      - run: scripts/smoke_python_artifact.sh release/distributions/*.whl

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix: {node-version: [22, 24]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "${{ matrix.node-version }}", cache: npm, cache-dependency-path: packages/typescript/package-lock.json}
      - run: cd packages/typescript && npm ci && npm run check && npm test && npm run build
      - run: mkdir -p release/distributions && cd packages/typescript && npm pack --pack-destination ../../release/distributions
      - run: python scripts/validate_artifact.py typescript release/distributions/*.tgz
      - run: scripts/smoke_typescript_artifact.sh release/distributions/*.tgz

  elixir:
    runs-on: ubuntu-latest
    strategy:
      matrix: {otp-version: ["27.3", "28.4"]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1.20.4
        with: {elixir-version: "1.18.4", otp-version: "${{ matrix.otp-version }}"}
      - run: cd packages/elixir && mix deps.get && mix format --check-formatted && mix compile --warnings-as-errors && mix test
      - run: mkdir -p release/distributions && cd packages/elixir && mix hex.build --output ../../release/distributions/robots_center.tar
      - run: python scripts/validate_artifact.py elixir release/distributions/*.tar
      - run: scripts/smoke_elixir_artifact.sh release/distributions/*.tar

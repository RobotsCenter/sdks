name: Release package

on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        options: [python, typescript, elixir]
        required: true
      ref:
        description: Exact signed component tag, such as python-v0.1.0
        required: true
      conformance_base_url:
        description: Deployment whose public contract endpoints must match this tag
        required: false
        type: string
      publish:
        description: Publish the validated artifact after protected-environment approval
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.package }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
      package: ${{ steps.validate.outputs.package }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ inputs.ref }}
          REPOSITORY: ${{ github.repository }}
          CONFORMANCE_BASE_URL: ${{ inputs.conformance_base_url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^${PACKAGE}-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$PUBLISH" == "true" && -z "$CONFORMANCE_BASE_URL" ]]; then
            echo "A conformance_base_url is required for publication" >&2
            exit 1
          fi

          ref_json=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/tags/$REF")
          tag_sha=$(jq -er '.object.sha' <<<"$ref_json")
          tag_json=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/tags/$tag_sha")
          [[ $(jq -er '.verification.verified' <<<"$tag_json") == "true" ]]
          [[ $(jq -er '.verification.reason' <<<"$tag_json") == "valid" ]]
          [[ $(jq -er '.object.type' <<<"$tag_json") == "commit" ]]
          commit=$(jq -er '.object.sha' <<<"$tag_json")

          git fetch --force origin "+refs/tags/$REF:refs/tags/$REF" "+refs/heads/main:refs/remotes/origin/main"
          [[ $(git cat-file -t "refs/tags/$REF") == "tag" ]]
          [[ $(git rev-parse "refs/tags/$REF^{commit}") == "$commit" ]]
          git merge-base --is-ancestor "$commit" origin/main

          version=${REF#${PACKAGE}-v}
          case "$PACKAGE" in
            python)
              git show "$commit:packages/python/pyproject.toml" | grep -Fxq 'name = "robotscenter"'
              git show "$commit:packages/python/pyproject.toml" | grep -Fxq "version = \"$version\""
              ;;
            typescript)
              package_json=$(git show "$commit:packages/typescript/package.json")
              [[ $(jq -er '.name' <<<"$package_json") == "@robotscenter/sdk" ]]
              [[ $(jq -er '.version' <<<"$package_json") == "$version" ]]
              ;;
            elixir)
              git show "$commit:packages/elixir/mix.exs" | grep -Fq 'app: :robots_center'
              git show "$commit:packages/elixir/mix.exs" | grep -Fq "version: \"$version\""
              ;;
          esac
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  conformance:
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.validate-ref.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - env:
          CONFORMANCE_BASE_URL: ${{ inputs.conformance_base_url }}
        run: |
          python -m json.tool contracts/openapi.json >/dev/null
          python -m json.tool contracts/realtime.json >/dev/null
          python -m unittest contracts/test_contract.py
          python -m unittest discover -s scripts -p 'test_*.py'
          if [[ -n "$CONFORMANCE_BASE_URL" ]]; then
            python scripts/check_contract_sync.py --base-url "$CONFORMANCE_BASE_URL"
          else
            echo "No deployment selected; committed contract validation only"
          fi

  build-python:
    if: inputs.package == 'python'
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {ref: "${{ needs.validate-ref.outputs.commit }}"}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: python -m pip install -e 'packages/python[dev]' twine
      - run: cd packages/python && ruff check . && mypy src && pytest
      - run: python -m build --outdir release/distributions packages/python
      - run: python -m twine check release/distributions/*
      - run: for artifact in release/distributions/*; do python scripts/validate_artifact.py python "$artifact" "${{ needs.validate-ref.outputs.version }}"; done
      - run: scripts/smoke_python_artifact.sh release/distributions/*.whl
      - run: python scripts/write_provenance.py --package python --tag "${{ inputs.ref }}" --commit "${{ needs.validate-ref.outputs.commit }}" --artifact-dir release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-${{ inputs.ref }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  build-typescript:
    if: inputs.package == 'typescript'
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {ref: "${{ needs.validate-ref.outputs.commit }}"}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 24, cache: npm, cache-dependency-path: packages/typescript/package-lock.json}
      - run: cd packages/typescript && npm ci && npm run check && npm test && npm run build
      - run: mkdir -p release/distributions && cd packages/typescript && npm pack --pack-destination ../../release/distributions
      - run: python scripts/validate_artifact.py typescript release/distributions/*.tgz "${{ needs.validate-ref.outputs.version }}"
      - run: scripts/smoke_typescript_artifact.sh release/distributions/*.tgz
      - run: python scripts/write_provenance.py --package typescript --tag "${{ inputs.ref }}" --commit "${{ needs.validate-ref.outputs.commit }}" --artifact-dir release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-${{ inputs.ref }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  build-elixir:
    if: inputs.package == 'elixir'
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {ref: "${{ needs.validate-ref.outputs.commit }}"}
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1.20.4
        with: {elixir-version: "1.18.4", otp-version: "28.4.2"}
      - run: cd packages/elixir && mix deps.get && mix format --check-formatted && mix compile --warnings-as-errors && mix test
      - run: mkdir -p release/distributions && cd packages/elixir && mix hex.build --output "../../release/distributions/robots_center-${{ needs.validate-ref.outputs.version }}.tar"
      - run: python scripts/validate_artifact.py elixir release/distributions/*.tar "${{ needs.validate-ref.outputs.version }}"
      - run: scripts/smoke_elixir_artifact.sh release/distributions/*.tar
      - run: python scripts/write_provenance.py --package elixir --tag "${{ inputs.ref }}" --commit "${{ needs.validate-ref.outputs.commit }}" --artifact-dir release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elixir-${{ inputs.ref }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish-python:
    if: inputs.publish && inputs.package == 'python'
    needs: [validate-ref, conformance, build-python]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {ref: "${{ needs.validate-ref.outputs.commit }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: "python-${{ inputs.ref }}", path: release}
      - run: python scripts/verify_provenance.py --package python --tag "${{ inputs.ref }}" --commit "${{ needs.validate-ref.outputs.commit }}" --artifact-dir release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/distributions/
          attestations: true

  publish-typescript:
    if: inputs.publish && inputs.package == 'typescript'
    needs: [validate-ref, conformance, build-typescript]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {ref: "${{ needs.validate-ref.outputs.commit }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: "typescript-${{ inputs.ref }}", path: release}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 24, registry-url: "https://registry.npmjs.org"}
      - run: python scripts/verify_provenance.py --package typescript --tag "${{ inputs.ref }}" --commit "${{ needs.validate-ref.outputs.commit }}" --artifact-dir release
      - run: npm install --global npm@^11.5.1
      - run: npm publish release/distributions/*.tgz --provenance --access public

  publish-elixir:
    if: inputs.publish && inputs.package == 'elixir'
    needs: [validate-ref, conformance, build-elixir]
    runs-on: ubuntu-latest
    environment: hex
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {ref: "${{ needs.validate-ref.outputs.commit }}"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: "elixir-${{ inputs.ref }}", path: release}
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1.20.4
        with: {elixir-version: "1.18.4", otp-version: "28.4.2"}
      - run: python scripts/verify_provenance.py --package elixir --tag "${{ inputs.ref }}" --commit "${{ needs.validate-ref.outputs.commit }}" --artifact-dir release
      - env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          HEX_PACKAGE_PATH: ${{ github.workspace }}/release/distributions/robots_center-${{ needs.validate-ref.outputs.version }}.tar
        run: |
          elixir scripts/publish_hex_artifact.exs

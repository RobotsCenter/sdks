[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robotscenter"
version = "0.1.0"
description = "Official Python SDK for the Robots Center API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Robots Center contributors"}]
dependencies = ["httpx>=0.27,<1", "typing-extensions>=4.12", "websockets>=13,<16"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["build>=1.2", "hatch>=1.13", "mypy>=1.13", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.urls]
Documentation = "https://robotscenter.net/docs"
Repository = "https://github.com/RobotsCenter/sdks"
Issues = "https://github.com/RobotsCenter/sdks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/robotscenter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
